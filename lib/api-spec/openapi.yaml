openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - bearerAuth: []
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project persistence operations
  - name: sessions
    description: Workflow session persistence operations
  - name: settings
    description: Workspace settings operations
  - name: ai
    description: AI provider and capability operations
  - name: exports
    description: Export package history operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List workflow sessions
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create workflow session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Created workflow session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
  /sessions/{sessionId}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get workflow session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Workflow session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
    patch:
      operationId: updateSession
      tags: [sessions]
      summary: Update workflow session summary
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionRequest"
      responses:
        "200":
          description: Updated workflow session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
  /sessions/{sessionId}/artifacts:
    patch:
      operationId: updateSessionArtifacts
      tags: [sessions]
      summary: Update workflow session artifacts
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionArtifactsRequest"
      responses:
        "200":
          description: Updated workflow session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
  /sessions/{sessionId}/generate/clarification:
    post:
      operationId: generateClarification
      tags: [sessions]
      summary: Generate clarification questions
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateWorkflowStepRequest"
      responses:
        "200":
          description: Updated workflow session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
  /sessions/{sessionId}/generate/prd:
    post:
      operationId: generatePrd
      tags: [sessions]
      summary: Generate PRD sections
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateWorkflowStepRequest"
      responses:
        "200":
          description: Updated workflow session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
  /sessions/{sessionId}/generate/epics:
    post:
      operationId: generateEpics
      tags: [sessions]
      summary: Generate epics
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateWorkflowStepRequest"
      responses:
        "200":
          description: Updated workflow session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
  /sessions/{sessionId}/generate/stories:
    post:
      operationId: generateStories
      tags: [sessions]
      summary: Generate stories
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateWorkflowStepRequest"
      responses:
        "200":
          description: Updated workflow session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
  /sessions/{sessionId}/generate/quality:
    post:
      operationId: generateQuality
      tags: [sessions]
      summary: Score stories and detect warnings
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateWorkflowStepRequest"
      responses:
        "200":
          description: Updated workflow session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get workspace settings
      responses:
        "200":
          description: Workspace settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update workspace settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Updated workspace settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
  /ai/provider:
    get:
      operationId: getAiProvider
      tags: [ai]
      summary: Get AI provider configuration status
      responses:
        "200":
          description: AI provider status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProviderConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
    put:
      operationId: updateAiProvider
      tags: [ai]
      summary: Save or update AI provider credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAiProviderRequest"
      responses:
        "200":
          description: Updated AI provider status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProviderConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
    delete:
      operationId: deleteAiProvider
      tags: [ai]
      summary: Remove AI provider credentials
      responses:
        "200":
          description: AI provider removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProviderConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
  /ai/provider/validate:
    post:
      operationId: validateAiProvider
      tags: [ai]
      summary: Validate saved AI provider credentials
      responses:
        "200":
          description: AI provider validation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProviderConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
  /ai/provider/rotate:
    post:
      operationId: rotateAiProvider
      tags: [ai]
      summary: Rotate AI provider credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateAiProviderRequest"
      responses:
        "200":
          description: Rotated AI provider status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProviderConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
  /ai/capability:
    get:
      operationId: getAiCapability
      tags: [ai]
      summary: Get AI capability mode for the workspace
      responses:
        "200":
          description: AI capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCapability"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
  /export-packages:
    get:
      operationId: listExportPackages
      tags: [exports]
      summary: List export packages
      responses:
        "200":
          description: Export package list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportPackageListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
    post:
      operationId: createExportPackage
      tags: [exports]
      summary: Create export package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExportPackageRequest"
      responses:
        "201":
          description: Export package created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportPackageDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
  /export-packages/{id}:
    get:
      operationId: getExportPackage
      tags: [exports]
      summary: Get export package details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Export package details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportPackageDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
  /export-packages/{id}/export-jira:
    post:
      operationId: exportToJira
      tags: [exports]
      summary: Export package to Jira
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Jira export results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExportResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
  /export-packages/{id}/export-github:
    post:
      operationId: exportToGitHub
      tags: [exports]
      summary: Export package to GitHub
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: GitHub export results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExportResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
  /integrations/config:
    get:
      operationId: listIntegrationConfigs
      tags: [integrations]
      summary: List integration configurations
      responses:
        "200":
          description: Integration configuration list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationConfigListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
  /integrations/config/{type}:
    put:
      operationId: updateIntegrationConfig
      tags: [integrations]
      summary: Update integration configuration
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIntegrationConfigRequest"
      responses:
        "200":
          description: Integration configuration updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
  responses:
    ApiError:
      description: API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ApiError:
      type: object
      properties:
        message:
          type: string
      required: [message]
    Phase:
      type: string
      enum:
        - intake
        - clarification
        - prd
        - epics
        - stories
        - quality
        - devReview
        - export
    PhaseStatus:
      type: string
      enum:
        - not-started
        - in-progress
        - complete
        - needs-attention
    ReviewStatus:
      type: string
      enum:
        - pending
        - approved
        - needs-clarification
        - too-large
        - technically-risky
        - blocked
        - missing-ac
    EpicPriority:
      type: string
      enum: [P0, P1, P2]
    StoryPriority:
      type: string
      enum: [P0, P1, P2, P3]
    ReadinessLabel:
      type: string
      enum:
        - Ready for Jira
        - Minor review needed
        - Needs PM refinement
        - Not ready
    WarningSeverity:
      type: string
      enum: [error, warning, info]
    ExportFormat:
      type: string
      enum: [markdown, csv, json]
    ExportStatus:
      type: string
      enum: [complete, partial, draft]
    PmRevisionStatus:
      type: string
      enum:
        - not-started
        - in-progress
        - resolved
    GenerationMode:
      type: string
      enum: [demo, live, unavailable]
    AiProviderStatus:
      type: string
      enum:
        - not_configured
        - validating
        - configured
        - validation_failed
        - disabled
    GenerationStatus:
      type: string
      enum: [idle, running, succeeded, failed, unavailable]
    GenerationStepState:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/GenerationStatus"
        mode:
          $ref: "#/components/schemas/GenerationMode"
        promptVersion:
          type: string
        updatedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        errorMessage:
          oneOf:
            - type: string
            - type: "null"
        provider:
          oneOf:
            - type: string
            - type: "null"
        model:
          oneOf:
            - type: string
            - type: "null"
        providerRequestId:
          oneOf:
            - type: string
            - type: "null"
        inputSnapshotHash:
          oneOf:
            - type: string
            - type: "null"
        tokenEstimate:
          oneOf:
            - type: integer
            - type: "null"
        costEstimateCents:
          oneOf:
            - type: integer
            - type: "null"
        errorClass:
          oneOf:
            - type: string
            - type: "null"
      required: [status, mode, promptVersion, updatedAt, errorMessage]
    WorkflowGenerationState:
      type: object
      properties:
        clarification:
          $ref: "#/components/schemas/GenerationStepState"
        prd:
          $ref: "#/components/schemas/GenerationStepState"
        epics:
          $ref: "#/components/schemas/GenerationStepState"
        stories:
          $ref: "#/components/schemas/GenerationStepState"
        quality:
          $ref: "#/components/schemas/GenerationStepState"
      required: [clarification, prd, epics, stories, quality]
    PhasesRecord:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/PhaseStatus"
      required:
        - intake
        - clarification
        - prd
        - epics
        - stories
        - quality
        - devReview
        - export
      properties:
        intake:
          $ref: "#/components/schemas/PhaseStatus"
        clarification:
          $ref: "#/components/schemas/PhaseStatus"
        prd:
          $ref: "#/components/schemas/PhaseStatus"
        epics:
          $ref: "#/components/schemas/PhaseStatus"
        stories:
          $ref: "#/components/schemas/PhaseStatus"
        quality:
          $ref: "#/components/schemas/PhaseStatus"
        devReview:
          $ref: "#/components/schemas/PhaseStatus"
        export:
          $ref: "#/components/schemas/PhaseStatus"
    ClarificationQuestion:
      type: object
      properties:
        id:
          type: string
        group:
          type: string
        text:
          type: string
        required:
          type: boolean
        answer:
          type: string
        skipped:
          type: boolean
      required: [id, group, text, required, answer, skipped]
    PrdSection:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        complete:
          type: boolean
        order:
          type: integer
      required: [id, title, content, complete, order]
    ReadinessScore:
      type: object
      properties:
        total:
          type: integer
        clarity:
          type: integer
        acceptanceCriteria:
          type: integer
        businessAlignment:
          type: integer
        technicalFeasibility:
          type: integer
        testability:
          type: integer
        edgeCasesErrorHandling:
          type: integer
        dependenciesDesignLocalization:
          type: integer
        label:
          $ref: "#/components/schemas/ReadinessLabel"
      required:
        - total
        - clarity
        - acceptanceCriteria
        - businessAlignment
        - technicalFeasibility
        - testability
        - edgeCasesErrorHandling
        - dependenciesDesignLocalization
        - label
    QualityWarning:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        message:
          type: string
        severity:
          $ref: "#/components/schemas/WarningSeverity"
      required: [id, type, message, severity]
    DeveloperReview:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ReviewStatus"
        comment:
          type: string
        reviewerName:
          type: string
        timestamp:
          type: string
          format: date-time
        pmRevisionStatus:
          $ref: "#/components/schemas/PmRevisionStatus"
      required: [status, comment, reviewerName, timestamp, pmRevisionStatus]
    Epic:
      type: object
      properties:
        id:
          type: string
